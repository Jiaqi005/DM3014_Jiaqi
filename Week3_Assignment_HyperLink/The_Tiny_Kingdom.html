<!-- DM3014 Interactive Devices, Ashley Hi 2026
  -- Week 3 - Net Art
  -- Hyperlink Poetry: The Tiny Kingdom
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tiny Kingdom</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    body {
      min-width: 1240px;
      min-height: 950px;
      margin: 0;
      overflow: auto;
      color: #16233a;
      background:
        radial-gradient(circle at 18% 20%, rgba(208, 236, 255, 0.75), transparent 26%),
        radial-gradient(circle at 82% 65%, rgba(232, 214, 255, 0.7), transparent 28%),
        #f7f4ee;
      font-family: Georgia, "Times New Roman", serif;
    }

    h1 {
      position: absolute;
      top: 42px;
      left: 80px;
      margin: 0;
      font-size: 46px;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .instruction {
      position: absolute;
      top: 102px;
      left: 83px;
      margin: 0;
      color: #657086;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .story-link {
      display: block;
      width: 330px;
      color: #244d82;
      font-size: 18px;
      line-height: 1.45;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .story-link:hover {
      color: #8a3f73;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <h1>The Tiny Kingdom</h1>
  <p class="instruction">Follow the trail. Each sentence opens another clue.</p>

  <script>
    // Each object below creates one piece of the story.
    // x and y control its position; label is the visible sentence;
    // url is the page or image that opens when the sentence is clicked.
    let links = [
      {
        x: 80,
        y: 155,
        label: "I drank a mysterious potion to invade the Tiny Kingdom and steal its legendary key.",
        url: "https://www.nongfuspring.com/mobile/goods/detail-all.html?id=1&pid=2",
        w: 560,
        h: 650
      },
      {
        x: 465,
        y: 235,
        label: "The potion shrank me—and I flew through the kingdom on a pair of strange wings.",
        url: "https://www.minecraft.net/en-us/article/taking-inventory--elytra",
        w: 700,
        h: 620
      },
      {
        x: 830,
        y: 320,
        label: "At last, I found the bank that guarded the key, and quietly slipped inside.",
        url: "https://www.nine.com.au/world-news/today-in-history-april-19-what-happened-on-this-day-lemon-juice-bank-robbery-20260417-p5zp32.html",
        w: 700,
        h: 650
      },
      {
        x: 510,
        y: 405,
        label: "The key was mine. Then the alarm screamed, and the tiny citizens surrounded me.",
        url: "https://commons.wikimedia.org/wiki/File:Kittens_in_Sewing_Basket.jpg",
        w: 650,
        h: 600
      },
      {
        x: 115,
        y: 490,
        label: "A dark-faced guard caught me before I could escape.",
        url: "https://commons.wikimedia.org/wiki/File:Siamese_kitten-2.jpg",
        w: 620,
        h: 620
      },
      {
        x: 465,
        y: 575,
        label: "Only then did I learn what the sacred ‘key’ really was.",
        url: "https://inabafoods.com/for-cats/",
        w: 650,
        h: 600
      },
      {
        x: 820,
        y: 660,
        label: "I returned it. In exchange, the guard gave me a tiny Ragdoll plush.",
        url: "https://gb.keycraftglobal.com/products/ragdoll-cat",
        w: 650,
        h: 620
      },
      {
        x: 470,
        y: 745,
        label: "I drank the last drop of potion and returned to my normal size.",
        url: "https://commons.wikimedia.org/wiki/File:Alice_drink_me_transparent.png",
        w: 600,
        h: 650
      },
      {
        x: 90,
        y: 830,
        label: "At home, the plush grew with me—and became my first real cat.",
        url: "https://en.wikipedia.org/wiki/Ragdoll",
        w: 650,
        h: 620
      }
    ];

    let defaultWidth = 600;
    let defaultHeight = 600;

    function setup() {
      noCanvas();

      for (let i = 0; i < links.length; i++) {
        let link = links[i];
        let a = createA("javascript:void(0)", link.label);
        a.position(link.x, link.y);
        a.class("story-link");
        a.mousePressed(() => openPopup(link));
      }
    }

    function openPopup(link) {
      let w = link.w || defaultWidth;
      let h = link.h || defaultHeight;

      window.open(
        link.url,
        "_blank",
        `width=${w},height=${h},left=100,top=50,resizable=yes,scrollbars=yes`
      );
    }
  </script>
</body>
</html>
